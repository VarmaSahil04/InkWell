<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inkwell — Your Journal</title>

  <!-- Fonts: Playfair Display (serif display) + Source Sans 3 (humanist sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <!-- App shell -->
  <div id="app">
    <nav id="main-nav" class="nav" aria-label="Main navigation"></nav>
    <main id="main-content" class="main"></main>
  </div>

  <!-- Custom modal -->
  <div id="modal-overlay" class="modal-overlay hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <h3 class="modal-title" id="modal-title"></h3>
      <p class="modal-body" id="modal-body"></p>
      <div class="modal-input-wrap hidden" id="modal-input-wrap">
        <input type="text" id="modal-input" class="input" autocomplete="off">
      </div>
      <div class="modal-actions">
        <button class="btn btn--ghost" id="modal-cancel">Cancel</button>
        <button class="btn btn--danger" id="modal-confirm">Confirm</button>
      </div>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- JS Entry point -->
  <script type="module" src="js/app.js?v=1.0.4"></script>
</body>
</html>
