# =========================================================================
# APPLICATION CONFIGURATION (Default / Production)
# All sensitive credentials MUST be provided via environment variables
# =========================================================================

server:
  port: ${PORT:8080}

spring:
  data:
    mongodb:
      uri: ${MONGO_URI}
      auto-index-creation: true
  redis:
    url: ${REDIS_URL:${REDIS_URI:}}

weather:
  api:
    key: ${WEATHER_API_KEY:}

# =========================================================================
# APPLICATION & BREVO API CONFIGURATION
# =========================================================================
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  brevo:
    api-key: ${BREVO_API_KEY:}
  mail:
    from: ${MAIL_FROM_ADDRESS:noreply@inkwell.app}
    from-name: ${MAIL_FROM_NAME:Inkwell Journal}